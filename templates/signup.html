{% extends "base.html" %}

{% block title %}Register – EcoAI Intelligent E-Waste Management{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="eco-card p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-3">
                        <i class="bi bi-person-plus fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create an Account</h3>
                    <p class="text-muted small">Join EcoAI to classify devices, track history, and request pickups</p>
                </div>

                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g. John Doe" required value="{{ request.form.get('name', '') }}">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required value="{{ request.form.get('email', '') }}">
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Choose a unique username" required value="{{ request.form.get('username', '') }}">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type your password" required>
                    </div>

                    <button type="submit" class="btn btn-eco-primary w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-check-lg me-1"></i> Create Account
                    </button>
                </form>

                <div class="text-center small text-muted">
                    Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-success">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
