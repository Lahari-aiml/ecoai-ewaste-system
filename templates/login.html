{% extends "base.html" %}

{% block title %}Sign In – EcoAI Intelligent E-Waste Management{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="eco-card p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-3">
                        <i class="bi bi-box-arrow-in-right fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to manage your e-waste classifications and pickups</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username_or_email" class="form-label">Username or Email <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username_or_email" name="username_or_email" placeholder="Enter username or email" required value="{{ request.form.get('username_or_email', '') }}">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-eco-primary w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="d-flex justify-content-between align-items-center small text-muted pt-2 border-top">
                    <div>Don't have an account? <a href="{{ url_for('signup') }}" class="fw-bold text-success">Sign Up</a></div>
                    <div><a href="{{ url_for('admin_login') }}" class="text-muted"><i class="bi bi-shield-lock me-1"></i>Admin</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
